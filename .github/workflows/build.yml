name: winage build

on:
  release:
    types: [published]
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # The project is on the v145 toolset, which VS 2022 does not have, so windows-latest
    # will not build it. Preview label; fold back into windows-latest once that image
    # ships Visual Studio 2026.
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Update Rust toolchain
        run: rustup update --no-self-update stable

      - name: Test Rust library
        run: cargo test --release

      - name: Build Rust static library
        run: cargo build --release

      - name: Build MFC front end
        run: msbuild winage\age.sln /t:age /p:Configuration=Release /p:Platform=x64 /v:minimal

      # Requires the "Microsoft Visual Studio Installer Projects" extension;
      # devenv is the only thing that can build a .vdproj.
      - name: Build MSI installer
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -property installationPath
          $devenv = Join-Path $vsPath "Common7\IDE\devenv.com"
          & $devenv winage\age.sln /Rebuild "Release|x64" /Project winage\ageSetup\AgeSetup.vdproj
          if ($LASTEXITCODE -ne 0) { throw "installer build failed with exit code $LASTEXITCODE" }

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: winage-msi
          path: winage\ageSetup\Release\ageSetup.msi
          if-no-files-found: error

  # Split out so the build itself, which also runs on pull requests, holds no write
  # permissions.
  release:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release upload
      id-token: write # provenance signing
      attestations: write
    steps:
      - name: Download the installer
        uses: actions/download-artifact@v4
        with:
          name: winage-msi

      # The installer is not code signed. This ties it to the workflow, commit
      # and repository that produced it, verifiable with `gh attestation verify`.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ageSetup.msi

      - name: Attach installer to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload ${{ github.event.release.tag_name }} ageSetup.msi --clobber
