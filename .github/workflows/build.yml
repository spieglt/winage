name: winage build

on:
  release:
    types: [published]
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Update Rust toolchain
        run: rustup update --no-self-update stable

      - name: Test Rust library
        run: cargo test --release

      - name: Build Rust static library
        run: cargo build --release

      - name: Build MFC front end
        run: msbuild winage\age.sln /t:age /p:Configuration=Release /p:Platform=x64 /v:minimal

      # Requires the "Microsoft Visual Studio Installer Projects" extension;
      # devenv is the only thing that can build a .vdproj.
      - name: Build MSI installer
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -property installationPath
          $devenv = Join-Path $vsPath "Common7\IDE\devenv.com"
          & $devenv winage\age.sln /Rebuild "Release|x64" /Project winage\ageSetup\ageSetup.vdproj
          if ($LASTEXITCODE -ne 0) { throw "installer build failed with exit code $LASTEXITCODE" }

      # /tr timestamps the signature so it stays valid after the certificate
      # expires. The v1.0 MSI was signed without one and no longer verifies.
      - name: Sign installer
        if: github.event_name == 'release'
        env:
          SIGN_CERT_BASE64: ${{ secrets.SIGN_CERT_BASE64 }}
          SIGN_PASS: ${{ secrets.SIGN_PASS }}
        run: |
          if (-not $env:SIGN_CERT_BASE64) { throw "SIGN_CERT_BASE64 secret is not set" }
          $cert = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($cert, [Convert]::FromBase64String($env:SIGN_CERT_BASE64))
          try {
            signtool.exe sign /f $cert /p $env:SIGN_PASS /fd SHA256 `
              /tr http://timestamp.sectigo.com /td SHA256 `
              winage\ageSetup\Release\ageSetup.msi
            if ($LASTEXITCODE -ne 0) { throw "signing failed with exit code $LASTEXITCODE" }
            signtool.exe verify /pa /v winage\ageSetup\Release\ageSetup.msi
            if ($LASTEXITCODE -ne 0) { throw "signature verification failed" }
          } finally {
            Remove-Item $cert -Force -ErrorAction SilentlyContinue
          }

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: winage-msi
          path: winage\ageSetup\Release\ageSetup.msi
          if-no-files-found: error

      - name: Attach installer to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload ${{ github.event.release.tag_name }} winage\ageSetup\Release\ageSetup.msi --clobber
